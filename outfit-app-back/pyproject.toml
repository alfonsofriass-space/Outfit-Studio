[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outfit-app-backend"
version = "0.1.0"
description = "FastAPI backend for the Outfit MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "fastapi[standard]==0.136.1",
    "itsdangerous==2.2.0",
    "openai==2.37.0",
    "pwdlib[argon2]==0.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.36",
    "uvicorn==0.47.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "experiments*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/generated", "experiments/output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The test suite prepares a dummy API key before importing app modules.
"tests/conftest.py" = ["E402"]
